name: KrtLab CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Vercel API syntax
        run: node --check api/gemini.js
      - name: Typecheck
        run: npm run lint
      - name: Build production artifacts
        run: npm run build
      - name: Audit production dependencies for critical vulnerabilities
        run: npm audit --omit=dev --audit-level=critical
