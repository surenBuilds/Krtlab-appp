name: KrtLab CI

on:
  pull_request:
    branches: [main, feat/growth-os-human-capital-market]
  push:
    branches: [main, feat/growth-os-human-capital-market]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Test Growth OS domain logic
        run: npm test
      - name: Build application and server
        run: npm run build
